[project]
name = "socratic-ai-backend"
version = "0.1.0"
description = "FastAPI backend for the SocraticAI tutor"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "openai>=3.40.0",
    "pydantic-settings>=2.16.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
